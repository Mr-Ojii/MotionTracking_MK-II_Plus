name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # "locales のインストールと日本語ロケール生成"
      - name: Setting TZ and Japanese Locale
        run: |
          sudo apt update && \
          sudo apt-get upgrade -y && \
          sudo apt install -y locales && \
          sudo locale-gen ja_JP.UTF-8 && \
          sudo update-locale LANG=ja_JP.UTF-8

      # install
      - name: install
        run: |
          sudo apt update &&\
          sudo apt-get upgrade -y &&\
          sudo apt install -y \
          make \
          cmake \
          gcc \
          g++ \
          gcc-mingw-w64 \
          g++-mingw-w64

      - name: Prepare /opt
        run: |
          sudo mkdir -p /opt && \
          sudo chown "$(id -u):$(id -g)" /opt

      # OpenCV は /usr/x86_64-w64-mingw32 配下に make install されるのでキャッシュする。
      # バージョンを上げた場合は key の -v1 部分を変更してキャッシュを無効化すること。
      - name: Cache MinGW-built dependencies (OpenCV)
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: /usr/x86_64-w64-mingw32
          key: mingw-deps-opencv4.12.0-v1

      # Setup OpenCV
      - name: Setup OpenCV
        if: steps.cache-deps.outputs.cache-hit != 'true'
        working-directory: /opt
        run: |
          git clone https://github.com/opencv/opencv.git -b 4.12.0 --depth 1

      - name: Setup OpenCV (contrib)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        working-directory: /opt
        run: |
          git clone https://github.com/opencv/opencv_contrib.git -b 4.12.0 --depth 1

      # Build
      - name: Build OpenCV
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          mkdir -p /opt/opencv/build-mingw

      - name: Build OpenCV (cmake)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        working-directory: /opt/opencv/build-mingw
        run: |
          cmake .. \
          -DCMAKE_SYSTEM_NAME=Windows \
          -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
          -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
          -DCMAKE_INSTALL_PREFIX=/usr/x86_64-w64-mingw32 \
          -DCMAKE_FIND_ROOT_PATH=/usr/x86_64-w64-mingw32 \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
          -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
          -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
          -DBUILD_SHARED_LIBS=OFF \
          -DBUILD_PERF_TESTS=OFF  \
          -DBUILD_TESTS=OFF \
          -DWITH_ADE=OFF \
          -DWITH_OPENJPEG=OFF \
          -DWITH_WEBP=OFF \
          -DWITH_TIFF=OFF \
          -DWITH_QUIRC=OFF \
          -DWITH_OPENEXR=OFF \
          -DWITH_JPEG=OFF \
          -DWITH_LAPACK=OFF \
          -DWITH_JASPER=OFF \
          -DWITH_PNG=OFF \
          -DWITH_GSTREAMER=OFF \
          -DWITH_FFMPEG=OFF \
          -DWITH_EIGEN=OFF \
          -DWITH_DSHOW=OFF \
          -DWITH_DIRECTX=OFF \
          -DWITH_ARITH_DEC=OFF \
          -DWITH_ARITH_ENC=OFF \
          -DWITH_1394=OFF \
          -DWITH_IMGCODEC_HDR=OFF \
          -DWITH_IMGCODEC_PFM=OFF \
          -DWITH_IMGCODEC_PXM=OFF \
          -DWITH_IMGCODEC_SUNRASTER=OFF \
          -DBUILD_OPENJPEG=OFF \
          -DBUILD_JASPER=OFF \
          -DBUILD_JAVA=OFF \
          -DBUILD_JPEG=OFF \
          -DBUILD_OPENEXR=OFF \
          -DBUILD_PNG=OFF \
          -DBUILD_TBB=OFF \
          -DBUILD_opencv_python3=OFF \
          -DOPENCV_EXTRA_MODULES_PATH=/opt/opencv_contrib/modules \
          && make -j$(nproc) \
          && sudo make install

      # ビルド
      - name: Build plugin
        run: |
          cd src
          make compile

      - name: Determine version
        id: version
        run: |
          REVCOUNT=$(git rev-list --count HEAD)
          VERSION="v${REVCOUNT}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package artifact
        run: |
          mkdir -p dist
          cp src/build/MotionTrackingMKIIPlusforAviUtl2.aux2 dist/
          cp README.md README.ja.md LICENSE dist/
          cp -r Licenses dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotionTrackingMKIIPlusforAviUtl2-${{ steps.version.outputs.version }}
          path: dist/
